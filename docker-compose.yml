services:
  mosapro-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosapro-relevamiento
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
